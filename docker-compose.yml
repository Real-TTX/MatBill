# MatBill - release stack: the published image and a PostgreSQL.
#   docker compose up -d
# Web: http://localhost:2505 (the first visit creates the administrator)
name: matbill

services:
  matbill:
    image: ghcr.io/real-ttx/matbill:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "2505:2505"   # web interface (HTTP: put a reverse proxy with TLS in front)
    environment:
      TZ: Europe/Berlin
      # MATBILL__Server__PublicUrl: https://rechnungen.example.de   # for share links and mails
    volumes:
      - matbill-data:/data
      # Backups to a NAS go over SMB from the app (Einstellungen > Backup > Ziele); a mounted folder works as well:
      # - /mnt/nas/matbill-backups:/backups

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: matbill
      POSTGRES_DB: matbill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matbill"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - matbill-db:/var/lib/postgresql/data

volumes:
  matbill-data:
  matbill-db:
